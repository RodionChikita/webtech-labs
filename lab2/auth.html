<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Lab 2</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page-auth">
    <main class="auth-center">
      <form action="https://httpbin.org/post" method="post" class="auth-card">
        <h1>Вход</h1>
        <div class="form-group">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" required />
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required />
        </div>
        <div class="form-group inline">
          <label class="inline"><input type="checkbox" id="remember" name="remember" value="yes" /> Запомнить меня</label>
        </div>
        <div class="actions">
          <button type="submit">Войти</button>
          <a href="./index.html" class="link">Назад к форме</a>
        </div>
      </form>
    </main>
  </body>
</html>
