<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Москва.Гид — Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="./index.html">Москва.Гид</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div id="nav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="./index.html">На главную</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container" style="margin-top:70px;">
      <div id="alerts" aria-live="polite" aria-atomic="true"></div>

      <h1 class="h4 fw-bold mb-3">Мои заявки</h1>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>#</th><th>Маршрут</th><th>Дата</th><th>Стоимость</th><th></th></tr></thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>

      <nav><ul id="ordersPager" class="pagination"></ul></nav>
    </div>

    <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Детали заявки</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div id="viewContent" class="small"></div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button></div>
        </div>
      </div>
    </div>

    <!-- Edit Modal (reuse fields) -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="editForm">
            <div class="modal-header"><h5 class="modal-title">Редактирование заявки</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
              <div class="row g-3">
                <input type="hidden" id="editId" />
                <div class="col-md-4"><label class="form-label" for="editDate">Дата</label><input id="editDate" class="form-control" type="date" required></div>
                <div class="col-md-4"><label class="form-label" for="editTime">Время</label><input id="editTime" class="form-control" type="time" step="1800" min="09:00" max="23:00" required></div>
                <div class="col-md-4"><label class="form-label" for="editDuration">Длительность</label><select id="editDuration" class="form-select"><option>1</option><option>2</option><option>3</option></select></div>
                <div class="col-md-4"><label class="form-label" for="editPersons">Людей</label><input id="editPersons" class="form-control" type="number" min="1" max="20" required></div>
                <div class="col-md-8">
                  <label class="form-label">Опции</label>
                  <div class="form-check"><input id="editOpt1" class="form-check-input" type="checkbox"><label class="form-check-label" for="editOpt1">Скидка студентам/школьникам (−15%)</label></div>
                  <div class="form-check"><input id="editOpt2" class="form-check-input" type="checkbox"><label class="form-check-label" for="editOpt2">Скидка пенсионерам (−25%)</label></div>
                </div>
              </div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Отменить</button><button class="btn btn-primary" type="submit">Сохранить</button></div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Удаление заявки</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">Вы уверены, что хотите удалить заявку?</div>
          <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Нет</button><button id="deleteYes" class="btn btn-danger">Да</button></div>
        </div>
      </div>
    </div>

    <footer class="py-4 bg-dark text-white-50 mt-5">
      <div class="container small d-flex flex-wrap gap-3 justify-content-between align-items-center">
        <div>© 2025 Москва.Гид</div>
        <div><i class="bi bi-envelope me-2"></i>hello@mosguide.example • <i class="bi bi-telephone ms-3 me-2"></i>+7 (000) 000‑00‑00</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="./js/cabinet.js"></script>
  </body>
</html>
